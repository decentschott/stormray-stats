<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0A0A0A;--card:#141414;--card2:#1c1c1c;--border:#242424;--text:#FFFFFF;--text2:#8A8A8A;--blue:#004F9E;--blue2:#0A5CB0;--blue-press:#003C78;--blue-ghost:#0E2238;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--dim:#6E6E6E;--soft:#B6B6B6;--faint:#3A3A3A;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);--safe-left:env(safe-area-inset-left);--safe-right:env(safe-area-inset-right)}
html,body{height:100%;overflow:hidden}
body{font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);padding-left:var(--safe-left);padding-right:var(--safe-right);font-size:17px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-appearance:none}
input,textarea{font-family:inherit;outline:none;border:none;background:var(--card2);color:var(--text);border-radius:8px;padding:10px 14px;font-size:15px}
input::placeholder,textarea::placeholder{color:var(--text2)}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-family:'Anton',sans-serif;font-size:20px;font-weight:400;letter-spacing:0.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo .mark{display:flex;align-items:center}.logo .mark img{width:32px;height:32px;object-fit:contain}
.nav{display:flex;gap:4px;flex-shrink:0;padding:0 8px;border-bottom:1px solid var(--border);background:var(--card);overflow-x:auto}
.nav button{padding:10px 16px;background:none;color:var(--text2);font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.22em;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.active{color:var(--blue);border-bottom-color:var(--blue)}
.screen{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;transition:all .15s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:active{background:var(--blue2)}
.btn-dark{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-dark:active{background:#252525}
.btn-danger{background:#3a1515;color:var(--red);border:1px solid #4a2020}.btn-danger:active{background:#4a2020}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-lg{padding:16px 24px;font-size:17px;border-radius:12px;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:16px}
h2{font-family:'Anton',sans-serif;font-size:22px;font-weight:400;letter-spacing:-0.01em;margin-bottom:16px}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.player-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.player-number{width:40px;height:40px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:18px;flex-shrink:0}
.player-info{flex:1}.player-name{font-weight:600;font-size:15px}.player-pos{font-size:12px;color:var(--text2)}
.player-actions{display:flex;gap:6px}
.game-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.score-display{font-family:'Bebas Neue',sans-serif;font-size:32px;font-weight:400;letter-spacing:0.04em}
.score-display .vs-label{font-size:12px;color:var(--text2);font-weight:400;margin:0 8px}
.quarter-pills{display:flex;gap:4px}
.quarter-pills button{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.quarter-pills button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.player-chips{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px 12px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg)}
.player-chip{padding:6px 10px;border-radius:6px;font-family:'Archivo',sans-serif;font-size:12px;font-weight:600;white-space:nowrap;background:var(--card2);color:var(--text2);border:2px solid transparent;text-align:center;cursor:pointer;user-select:none;touch-action:none}
.player-chip.selected{background:var(--blue-ghost);color:var(--blue2);border-color:var(--blue)}
.player-chip .chip-num{font-weight:800;margin-right:4px}
.live-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.court-container{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0;position:relative;overflow:hidden}
.court-container svg{width:100%;height:100%;max-height:400px}
.stat-bar{padding:8px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.stat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-radius:6px;background:var(--card2);color:var(--text);font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em;border:1px solid var(--border);min-height:52px;position:relative}
.stat-btn .count{font-family:'Bebas Neue',sans-serif;font-size:22px;font-weight:400;color:var(--blue);line-height:1}
.stat-btn:active{background:var(--blue);border-color:var(--blue)}
.stat-btn.hustle{background:var(--blue-ghost);border-color:var(--blue);color:var(--blue);grid-column:span 2}
.stat-btn.undo{background:var(--card2);color:var(--orange);grid-column:span 2;flex-direction:row;gap:6px}
.shot-popup{position:absolute;z-index:50;display:flex;gap:8px;transform:translate(-50%,-120%)}
.shot-popup button{padding:14px 24px;border-radius:10px;font-size:15px;font-weight:700;min-width:80px}
.shot-popup .made{background:var(--green);color:#fff}
.shot-popup .missed{background:var(--red);color:#fff}
.box-table{width:100%;border-collapse:collapse;font-size:12px}
.box-table th{padding:8px 6px;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;color:var(--text2);border-bottom:2px solid var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:0.14em;position:sticky;top:0;background:var(--card)}
.box-table th:first-child{text-align:left}
.box-table td{padding:6px;text-align:center;border-bottom:1px solid var(--border)}
.box-table td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.box-table tr:last-child td{font-weight:700;border-top:2px solid var(--blue);border-bottom:none}
.report-section{margin-bottom:20px}
.report-section h3{font-family:'Archivo',sans-serif;font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:0.22em;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.leader-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px}
.leader-stat{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:24px;color:var(--blue)}
.hustle-row{padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px}
.hustle-tag{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--blue-ghost);color:var(--blue);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;margin-right:6px;letter-spacing:0.02em}
.compelling-stat{text-align:center;padding:24px;background:var(--blue-ghost);border:2px solid var(--blue);border-radius:8px;font-family:'Archivo',sans-serif;font-size:17px;font-weight:700}
.season-table{width:100%;border-collapse:collapse;font-size:11px;overflow-x:auto;display:block}
.season-table th{padding:8px 4px;text-align:center;font-family:'Archivo',sans-serif;font-weight:700;color:var(--text2);border-bottom:2px solid var(--blue);font-size:9px;text-transform:uppercase;letter-spacing:0.14em;white-space:nowrap;position:sticky;top:0;background:var(--card)}
.season-table th:first-child{text-align:left}
.season-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.season-table td:first-child{text-align:left;font-weight:600}
.game-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.game-list-item:active{background:var(--card2)}
.game-date{font-size:12px;color:var(--text2)}
.game-opponent{font-weight:700;font-size:15px}
.game-score{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:22px;color:var(--blue)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px}
.tab-bar button{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.tab-bar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* === ROLE SYSTEM === */
.role-cards{display:grid;grid-template-columns:1fr;gap:12px;max-width:420px;margin:0 auto}
.role-card{background:var(--card);border:2px solid var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:all .15s}
.role-card:active{border-color:var(--blue);background:var(--blue-ghost)}
.role-icon{font-size:36px;margin-bottom:8px;display:block}
.role-name{font-family:'Anton',sans-serif;font-size:18px;font-weight:400;margin-bottom:4px;letter-spacing:-0.01em}
.role-desc{font-size:13px;color:var(--text2)}
.role-taken{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(245,158,11,.15);color:var(--orange)}
.conn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conn-on{background:var(--green)}.conn-off{background:var(--red)}
.role-tag{padding:3px 8px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.14em}
.role-tag.offense{background:rgba(34,197,94,.15);color:var(--green)}
.role-tag.defense{background:rgba(239,68,68,.15);color:var(--red)}
.role-tag.coach{background:var(--blue-ghost);color:var(--blue)}
.role-tag.both{background:rgba(245,158,11,.15);color:var(--orange)}
.live-banner{padding:14px 16px;background:var(--blue-ghost);border:1px solid var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;cursor:pointer}
.live-banner:active{background:rgba(0,79,158,.2)}
.game-goals{margin-top:16px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.game-goals h4{font-family:'Archivo',sans-serif;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:0.22em;font-weight:700;margin-bottom:8px}
.goal-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.goal-row:last-child{border-bottom:none}
.goal-label{color:var(--text2);font-size:12px;flex:1}
.goal-value{font-family:'Bebas Neue',sans-serif;font-size:18px;min-width:40px;text-align:right}
.goal-target{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);min-width:50px;text-align:right;margin-left:8px}
.goal-hit{color:var(--green)}.goal-miss{color:var(--red)}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.coach-section{margin-bottom:20px}
.coach-section h3{font-family:'Archivo',sans-serif;font-size:12px;color:var(--blue);text-transform:uppercase;letter-spacing:0.22em;font-weight:700;margin-bottom:10px}

/* === IPHONE RESPONSIVE === */
@media(max-width:430px){
  .header{padding:8px 12px}.logo{font-size:15px;letter-spacing:1.5px}.logo .mark img{width:26px;height:26px}
  .nav button{padding:8px 12px;font-size:11px;letter-spacing:0.5px}.screen{padding:12px}
  h2{font-size:17px;margin-bottom:12px}.btn{padding:10px 16px;font-size:14px}.btn-sm{padding:7px 11px;font-size:12px}.btn-lg{padding:14px 20px;font-size:16px}
  .game-bar{padding:8px 12px}.score-display{font-size:22px;letter-spacing:1px}.score-display .vs-label{font-size:10px;margin:0 6px}
  .quarter-pills button{padding:5px 9px;font-size:11px}
  .player-chips{gap:4px;padding:8px 10px}.player-chip{padding:6px 10px;font-size:11px;border-width:1.5px}.player-chip .chip-num{margin-right:2px}
  .court-container{padding:4px}.court-container svg{max-height:240px}
  .stat-bar{padding:6px 8px}.stat-btn{padding:6px 2px;font-size:9px;min-height:44px;border-radius:6px}.stat-btn .count{font-size:15px}.stat-btn.hustle{font-size:11px}.stat-btn.undo{font-size:11px}
  .shot-popup button{padding:16px 20px;font-size:14px;min-width:70px;border-radius:12px}.shot-popup{gap:12px}
  .player-card{padding:10px;gap:10px}.player-number{width:36px;height:36px;font-size:14px}.player-name{font-size:14px}.player-actions .btn{padding:6px 10px;font-size:11px}
  .modal-overlay{padding:8px;align-items:flex-end}.modal{max-width:100%;border-radius:16px 16px 8px 8px;padding:20px 16px;max-height:85vh}
  .leader-row{padding:8px 10px}.leader-stat{font-size:17px}.compelling-stat{font-size:16px;padding:16px}.report-section h3{font-size:12px}
  .game-list-item{padding:12px}.game-opponent{font-size:14px}.game-score{font-size:16px}
  .box-table{font-size:10px}.box-table th{padding:6px 3px;font-size:8px}.box-table td{padding:4px 3px}
  .season-table{font-size:10px}.season-table th{font-size:8px;padding:6px 3px}.season-table td{padding:4px 3px}
  .tab-bar button{padding:8px;font-size:12px}
  .role-card{padding:16px}.role-icon{font-size:28px}.role-name{font-size:16px}
}
@media(max-width:375px){
  .logo{font-size:13px}.nav button{padding:7px 8px;font-size:10px}.score-display{font-size:20px}
  .quarter-pills button{padding:4px 7px;font-size:10px}.player-chip{padding:5px 8px;font-size:10px}
  .court-container svg{max-height:200px}.stat-btn{min-height:40px;font-size:8px}.stat-btn .count{font-size:13px}.grid4{gap:4px}
}
@media(min-width:1024px){
  .court-container svg{max-height:500px}.stat-bar{max-width:600px;margin:0 auto}.screen{max-width:800px;margin:0 auto;padding:24px}.modal{max-width:500px}
}
@media(min-width:700px) and (max-width:1023px){
  .court-container svg{max-height:440px}.stat-btn{min-height:56px;font-size:12px}.stat-btn .count{font-size:20px}.player-chip{padding:10px 16px;font-size:14px}
}
</style>

<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo} = React;
const h = React.createElement;

// === FIREBASE ===
firebase.initializeApp({
  apiKey:"AIzaSyB0a3hS3Fe-X1UpojdfaOdvt2yuTsL81ag",
  authDomain:"shorewoodhoops-19d1d.firebaseapp.com",
  databaseURL:"https://shorewoodhoops-19d1d-default-rtdb.firebaseio.com",
  projectId:"shorewoodhoops-19d1d",
  storageBucket:"shorewoodhoops-19d1d.firebasestorage.app",
  messagingSenderId:"977266607962",
  appId:"1:977266607962:web:73567ce96d582ff342d563"
});
firebase.database().goOnline();
try{firebase.database().ref().keepSynced&&firebase.database().ref('roster').keepSynced(true);firebase.database().ref('games').keepSynced(true)}catch(e){}
const db = firebase.database();

// Device ID — persists per browser/device
const DEVICE_ID = localStorage.getItem('sw_hoops_did') || localStorage.getItem('stormray_did') || (()=>{
  const id='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  localStorage.setItem('sw_hoops_did',id);return id;
})();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toArr=v=>Array.isArray(v)?v:(v?Object.values(v):[]);
const objToArr=o=>o?Object.values(o):[];
const HUSTLE_TAGS=['Dove for loose ball','Took a charge','Deflection','Box out','Hustle back on D','Saved possession','50/50 ball','Screen & recover'];

// === STAT CALCULATIONS ===
function calcPlayerStats(game,pid){
  const shots=objToArr(game.shots).filter(s=>s.pid===pid);
  const fgm=shots.filter(s=>s.made).length,fga=shots.length;
  const tpm=shots.filter(s=>s.made&&s.is3).length,tpa=shots.filter(s=>s.is3).length;
  const ps=game.playerStats||{},p=ps[pid]||{};
  const ftm=p.ftm||0,fta=(p.ftm||0)+(p.ftx||0);
  const pts=(fgm-tpm)*2+tpm*3+ftm;
  return {fgm,fga,fgp:fga?((fgm/fga)*100).toFixed(0):'-',tpm,tpa,tpp:tpa?((tpm/tpa)*100).toFixed(0):'-',
    ftm,fta,ftp:fta?((ftm/fta)*100).toFixed(0):'-',pts,reb:p.reb||0,ast:p.ast||0,stl:p.stl||0,blk:p.blk||0,
    to:p.to||0,foul:p.foul||0,hustle:objToArr(game.hustlePlays).filter(hp=>hp.pid===pid).length};
}

function calcTeamStats(game){
  const pids=toArr(game.activePlayers);
  const team={fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,foul:0,hustle:0};
  pids.forEach(pid=>{const s=calcPlayerStats(game,pid);Object.keys(team).forEach(k=>{if(typeof s[k]==='number')team[k]+=s[k]})});
  team.fgp=team.fga?((team.fgm/team.fga)*100).toFixed(1):'-';
  team.tpp=team.tpa?((team.tpm/team.tpa)*100).toFixed(1):'-';
  team.ftp=team.fta?((team.ftm/team.fta)*100).toFixed(1):'-';
  return team;
}

function getStatLeaders(game,roster){
  const pids=toArr(game.activePlayers),stats={};
  pids.forEach(pid=>{stats[pid]=calcPlayerStats(game,pid)});
  const find=key=>{let best=null,bv=-1;pids.forEach(pid=>{if(stats[pid][key]>bv){bv=stats[pid][key];best=pid}});
    const p=roster.find(r=>r.id===best);return p?{name:p.name,number:p.number,value:bv}:null};
  return {pts:find('pts'),reb:find('reb'),ast:find('ast'),stl:find('stl'),blk:find('blk')};
}

function getMostCompelling(game){
  const t=calcTeamStats(game),c=[];
  if(t.fga>=15){const p=parseFloat(t.fgp);if(p>=50)c.push({text:`Shot ${t.fgp}% from the field (${t.fgm}/${t.fga})`,score:p-45})}
  if(t.tpa>=8){const p=parseFloat(t.tpp);if(p>=35)c.push({text:`Hit ${t.tpm} threes at ${t.tpp}% (${t.tpm}/${t.tpa})`,score:p-30})}
  if(t.ast>=10)c.push({text:`Dished out ${t.ast} assists as a team`,score:t.ast-8});
  if(t.stl>=8)c.push({text:`Forced ${t.stl} steals on defense`,score:t.stl-6});
  if(t.to<=8&&t.fga>=20)c.push({text:`Only ${t.to} turnovers`,score:12-t.to});
  if(t.reb>=30)c.push({text:`Controlled the boards with ${t.reb} rebounds`,score:t.reb-25});
  if(t.ast&&t.to)c.push({text:`${(t.ast/t.to).toFixed(1)}:1 assist-to-turnover ratio`,score:(t.ast/t.to)-1});
  if(t.hustle>=5)c.push({text:`${t.hustle} Shorewood Hustle Plays`,score:t.hustle-3});
  c.sort((a,b)=>b.score-a.score);return c[0]?.text||`Scored ${t.pts} points as a team`;
}

// === 3PT DETECTION ===
const BASKET_X=250,BASKET_Y=52.5,THREE_R=221.5,CORNER_X=33;
function is3pt(x,y){if(x<CORNER_X||x>500-CORNER_X)return true;const dx=x-BASKET_X,dy=y-BASKET_Y;return Math.sqrt(dx*dx+dy*dy)>THREE_R}

// === HALF COURT SVG ===
function HalfCourt({shots=[],onTap,selectedPid,readOnly}){
  const svgRef=useRef(null);
  const [popup,setPopup]=useState(null);
  const handlePointerDown=useCallback(e=>{
    if(readOnly)return;
    if(!selectedPid){alert('Select a player first');return}
    const svg=svgRef.current,pt=svg.createSVGPoint();
    pt.x=e.clientX;pt.y=e.clientY;
    const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
    if(sp.x<5||sp.x>495||sp.y<5||sp.y>415)return;
    setPopup({x:sp.x,y:sp.y});
  },[selectedPid,readOnly]);
  const handleResult=made=>{if(!popup)return;
    onTap({x:popup.x,y:popup.y,made,is3:is3pt(popup.x,popup.y),pid:selectedPid,id:uid(),ts:Date.now()});
    setPopup(null)};
  const arcStartY=Math.sqrt(THREE_R*THREE_R-(BASKET_X-CORNER_X)*(BASKET_X-CORNER_X));
  const arcY=BASKET_Y+arcStartY;
  const arcPath=`M ${CORNER_X} 0 L ${CORNER_X} ${arcY} A ${THREE_R} ${THREE_R} 0 0 0 ${500-CORNER_X} ${arcY} L ${500-CORNER_X} 0`;
  return h('div',{style:{position:'relative',width:'100%',height:'100%'}},
    h('svg',{ref:svgRef,viewBox:'0 0 500 420',style:{width:'100%',height:'100%',touchAction:'none'},onPointerDown:handlePointerDown},
      h('rect',{x:0,y:0,width:500,height:420,fill:'#111',rx:4}),
      h('rect',{x:2,y:2,width:496,height:416,fill:'none',stroke:'#333',strokeWidth:2,rx:3}),
      h('line',{x1:2,y1:418,x2:498,y2:418,stroke:'#333',strokeWidth:2}),
      h('path',{d:'M 190 418 A 60 60 0 0 1 310 418',fill:'none',stroke:'#333',strokeWidth:1.5}),
      h('rect',{x:170,y:0,width:160,height:190,fill:'rgba(0,79,158,0.08)',stroke:'#004F9E',strokeWidth:1.5,strokeOpacity:0.4}),
      h('line',{x1:170,y1:190,x2:330,y2:190,stroke:'#004F9E',strokeWidth:1.5,strokeOpacity:0.4}),
      h('circle',{cx:250,cy:190,r:60,fill:'none',stroke:'#004F9E',strokeWidth:1.5,strokeOpacity:0.3}),
      h('path',{d:'M 210 0 A 40 40 0 0 0 290 0',fill:'none',stroke:'#333',strokeWidth:1}),
      h('path',{d:arcPath,fill:'none',stroke:'#004F9E',strokeWidth:2,strokeOpacity:0.6}),
      h('line',{x1:220,y1:38,x2:280,y2:38,stroke:'#666',strokeWidth:2}),
      h('circle',{cx:250,cy:BASKET_Y,r:8,fill:'none',stroke:'var(--orange)',strokeWidth:2}),
      h('line',{x1:244,y1:58,x2:250,y2:68,stroke:'#555',strokeWidth:0.8}),
      h('line',{x1:256,y1:58,x2:250,y2:68,stroke:'#555',strokeWidth:0.8}),
      ...shots.map(s=>h('circle',{key:s.id,cx:s.x,cy:s.y,r:6,fill:s.made?'var(--green)':'var(--red)',stroke:'#fff',strokeWidth:1.5,opacity:0.85,style:{pointerEvents:'none'}})),
      h('text',{x:60,y:200,fill:'#333',fontSize:10,fontWeight:700},'3'),
      h('text',{x:430,y:200,fill:'#333',fontSize:10,fontWeight:700},'3')
    ),
    popup&&h('div',{className:'shot-popup',style:{position:'absolute',left:`${(popup.x/500)*100}%`,top:`${(popup.y/420)*100}%`,transform:'translate(-50%,-140%)'}},
      h('button',{className:'made',onClick:()=>handleResult(true)},'Made ✓'),
      h('button',{className:'missed',onClick:()=>handleResult(false)},'Miss ✗'))
  );
}

    setUndoStack(s=>[...s,{type:'stat',pid:selPid,key,prev}])};
  const addShot=shot=>{if(!selPid)return;shot.pid=selPid;shot.quarter=game.quarter;
    const ref=db.ref(`games/${gameId}/shots`).push();shot.id=ref.key;ref.set(shot);
    setUndoStack(s=>[...s,{type:'shot',id:ref.key}])};
  const addHustle=hp=>{hp.quarter=game.quarter;
    db.ref(`games/${gameId}/hustlePlays/${hp.id}`).set(hp);
    setUndoStack(s=>[...s,{type:'hustle',id:hp.id}]);setShowHustle(false)};
  const undo=()=>{if(!undoStack.length)return;const last=undoStack[undoStack.length-1];
    if(last.type==='stat')db.ref(`games/${gameId}/playerStats/${last.pid}/${last.key}`).set(last.prev);
    else if(last.type==='shot')db.ref(`games/${gameId}/shots/${last.id}`).remove();
    else if(last.type==='hustle')db.ref(`games/${gameId}/hustlePlays/${last.id}`).remove();
    setUndoStack(s=>s.slice(0,-1))};
  const endGame=()=>{if(confirm('End this game?')){db.ref(`games/${gameId}/status`).set('completed');onEnd(gameId)}};

  return h('div',{className:'app',style:{height:'100%',display:'flex',flexDirection:'column'}},
    h(GameBar,{game,gameId,teamPts:teamStats.pts,role:'both',onSnapshot:()=>setShowSnap(true)}),

        background:tab==='off'?'var(--blue)':'var(--card)',color:tab==='off'?'#fff':'var(--text2)'},onClick:()=>setTab('off')},'OFFENSE'),
      h('button',{style:{flex:1,padding:'6px 0',fontSize:12,fontFamily:'Archivo',fontWeight:700,letterSpacing:'0.12em',border:'none',cursor:'pointer',

    // Content area
    tab==='off'?h(React.Fragment,null,

      selPlayer&&h('div',{style:{textAlign:'center',padding:'4px 0',fontSize:12,color:'var(--text2)'}},
        `#${selPlayer.number} ${selPlayer.name}`,
        h('span',{style:{color:'var(--blue)',fontWeight:700,marginLeft:8}},`${pStats.pts}pts ${pStats.ast}ast ${pStats.to}to`)),
      h('div',{className:'stat-bar'},
        h('div',{className:'grid4',style:{marginBottom:6}},

            const count=selPid&&game.playerStats?.[selPid]?game.playerStats[selPid][key]||0:0;
            return h('button',{key,className:'stat-btn',onClick:()=>addStat(key)},

const GAME_GOALS=[
  {id:'to',label:'Turnovers',target:11,dir:'lte',unit:'',calc:g=>calcTeamStats(g).to},
  {id:'fta',label:'FT Attempts',target:24,dir:'gte',unit:'',calc:g=>calcTeamStats(g).fta},
  {id:'oppFta',label:'Opp FT Att',target:15,dir:'lte',unit:'',calc:g=>g.oppFta||0},
  {id:'kills',label:'Kills',target:5,dir:'gte',unit:'',calc:g=>g.kills||0,note:'3 consec stops = 1'},
  {id:'orebPct',label:'OREB %',target:38,dir:'gte',unit:'%',calc:g=>{const t=calcTeamStats(g);const oreb=g.teamOreb||0;const totalOreb=oreb+(g.oppDreb||0);return totalOreb?Math.round((oreb/totalOreb)*100):0}},
  {id:'oppOreb',label:'Opp OREB',target:9,dir:'lte',unit:'',calc:g=>g.oppOreb||0},
  {id:'energy',label:'Energy',target:1,dir:'gte',unit:'',calc:g=>g.energyRating||0,note:'Coach rates 0-3'}
];
function goalHit(goal,val){return goal.dir==='lte'?val<=goal.target:val>=goal.target}

function GameGoals({game,gameId,editable}){
  const goals=GAME_GOALS.map(g=>({...g,value:g.calc(game)}));
  const setField=(field,val)=>{if(gameId)db.ref(`games/${gameId}/${field}`).set(val)};
  return h('div',{className:'game-goals'},
    h('h4',null,'[ GAME GOALS ]'),
    goals.map(g=>h('div',{key:g.id,className:'goal-row'},
      h('span',{className:'goal-label'},g.label,g.note?h('span',{style:{fontSize:10,color:'var(--dim)',marginLeft:4}},g.note):null),
      (editable&&['oppFta','kills','oppOreb','energy'].includes(g.id))?
        h('div',{style:{display:'flex',alignItems:'center',gap:4}},
          h('button',{style:{width:28,height:28,borderRadius:4,background:'var(--card2)',color:'var(--text)',border:'1px solid var(--border)',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'},
            onClick:()=>{const field=g.id==='oppFta'?'oppFta':g.id==='kills'?'kills':g.id==='oppOreb'?'oppOreb':'energyRating';
              setField(field,Math.max(0,(game[field]||0)-1))}},'-'),
          h('span',{className:`goal-value ${goalHit(g,g.value)?'goal-hit':'goal-miss'}`},g.value,g.unit),
          h('button',{style:{width:28,height:28,borderRadius:4,background:'var(--card2)',color:'var(--text)',border:'1px solid var(--border)',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'},
            onClick:()=>{const field=g.id==='oppFta'?'oppFta':g.id==='kills'?'kills':g.id==='oppOreb'?'oppOreb':'energyRating';
              const max=g.id==='energy'?3:99;setField(field,Math.min(max,(game[field]||0)+1))}},'+'))
        :h('span',{className:`goal-value ${goalHit(g,g.value)?'goal-hit':'goal-miss'}`},g.value,g.unit),
      h('span',{className:'goal-target'},g.dir==='lte'?`≤${g.target}`:`≥${g.target}`))));
}

// === SNAPSHOT MODAL ===
function SnapshotModal({game,gameId,games,roster,onClose}){
  const team=calcTeamStats(game);
  const completed=Object.values(games||{}).filter(g=>g.status==='completed'&&g.id!==gameId);
  const lastGame=completed.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  const lastTeam=lastGame?calcTeamStats(lastGame):null;
  // Season averages
  const seasonAvg=completed.length?{pts:0,fgp:0,tpp:0,reb:0,ast:0,stl:0,blk:0,to:0,fta:0}:null;
  if(seasonAvg){completed.forEach(g=>{const t=calcTeamStats(g);
    seasonAvg.pts+=t.pts;seasonAvg.fgp+=parseFloat(t.fgp);seasonAvg.tpp+=parseFloat(t.tpp);
    seasonAvg.reb+=t.reb;seasonAvg.ast+=t.ast;seasonAvg.stl+=t.stl;seasonAvg.blk+=t.blk;seasonAvg.to+=t.to;seasonAvg.fta+=t.fta});
    const n=completed.length;Object.keys(seasonAvg).forEach(k=>seasonAvg[k]=Math.round(seasonAvg[k]/n*10)/10)}
  const cmp=(cur,prev,better)=>{if(prev==null)return '';const d=cur-prev;
    const good=better==='lower'?d<=0:d>=0;return h('span',{style:{fontSize:10,color:good?'var(--green)':'var(--red)',marginLeft:4}},d>0?`+${Math.round(d*10)/10}`:`${Math.round(d*10)/10}`)};
  const statRow=(label,cur,lastVal,avgVal,better)=>h('div',{style:{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid var(--border)'}},
    h('span',{style:{color:'var(--text2)',fontSize:12}},label),
    h('div',{style:{display:'flex',gap:16,fontSize:13}},
      h('span',{style:{fontWeight:700,minWidth:40,textAlign:'right'}},cur),
      lastVal!=null?h('span',{style:{color:'var(--dim)',minWidth:60,textAlign:'right'}},lastVal,cmp(cur,lastVal,better)):h('span',{style:{minWidth:60}}),
      avgVal!=null?h('span',{style:{color:'var(--dim)',minWidth:60,textAlign:'right'}},avgVal,cmp(cur,avgVal,better)):h('span',{style:{minWidth:60}})));
  return h('div',{className:'modal-overlay',onClick:onClose},
    h('div',{className:'modal',style:{maxWidth:420,maxHeight:'85vh',overflow:'auto',padding:20},onClick:e=>e.stopPropagation()},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
        h('h3',{style:{margin:0,fontFamily:'Anton',fontSize:18}},'SNAPSHOT'),
        h('button',{style:{background:'none',border:'none',color:'var(--text2)',fontSize:20,cursor:'pointer'},onClick:onClose},'✕')),
      h('div',{style:{textAlign:'center',marginBottom:12}},
        h('div',{style:{fontSize:11,color:'var(--text2)'}},`vs ${game.opponent} — Q${game.quarter<=4?game.quarter:'OT'}`),
        h('div',{style:{fontSize:36,fontFamily:'Bebas Neue',letterSpacing:2}},`${team.pts} — ${game.oppScore||0}`)),
      // Game Goals
      h('div',{style:{marginBottom:16}},
        h('div',{style:{fontSize:11,fontFamily:'JetBrains Mono',color:'var(--blue)',letterSpacing:'0.14em',marginBottom:6}},'GAME GOALS'),
        GAME_GOALS.map(g=>{const val=g.calc(game);const hit=goalHit(g,val);
          return h('div',{key:g.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'3px 0',fontSize:12}},
            h('span',{style:{color:'var(--text2)'}},g.label),
            h('span',{style:{fontWeight:700,color:hit?'var(--green)':'var(--red)'}},val,g.unit,' ',g.dir==='lte'?`≤${g.target}`:`≥${g.target}`,hit?' ✓':' ✗'))})),
      // Column headers
      h('div',{style:{display:'flex',justifyContent:'flex-end',gap:16,fontSize:10,color:'var(--dim)',marginBottom:4,paddingRight:0}},
        h('span',{style:{minWidth:40,textAlign:'right',fontWeight:700}},'NOW'),
        lastTeam?h('span',{style:{minWidth:60,textAlign:'right'}},'LAST'):null,
        seasonAvg?h('span',{style:{minWidth:60,textAlign:'right'}},'AVG'):null),
      // Key stats comparison
      statRow('Points',team.pts,lastTeam?.pts,seasonAvg?.pts,'higher'),
      statRow('FG%',parseFloat(team.fgp),lastTeam?parseFloat(lastTeam.fgp):null,seasonAvg?.fgp,'higher'),
      statRow('3P%',parseFloat(team.tpp),lastTeam?parseFloat(lastTeam.tpp):null,seasonAvg?.tpp,'higher'),
      statRow('Rebounds',team.reb,lastTeam?.reb,seasonAvg?.reb,'higher'),
      statRow('Assists',team.ast,lastTeam?.ast,seasonAvg?.ast,'higher'),
      statRow('Steals',team.stl,lastTeam?.stl,seasonAvg?.stl,'higher'),
      statRow('Turnovers',team.to,lastTeam?.to,seasonAvg?.to,'lower'),
      statRow('FT Att',team.fta,lastTeam?.fta,seasonAvg?.fta,'higher')));
}

function PostGameReport({gameId,games,roster,onSnapshot}){

  const team=calcTeamStats(game);

    try{const canvas=await html2canvas(el,{backgroundColor:'#0A0A0A',scale:2});
      const link=document.createElement('a');link.download=`shorewood_vs_${game.opponent}_${game.date}.png`;link.href=canvas.toDataURL();link.click()}catch(e){alert('Export failed: '+e.message)}};

    pids.forEach(pid=>{const p=roster.find(r=>r.id===pid);const s=calcPlayerStats(game,pid);
      boxData.push([p?.name||'?',p?.number||'',s.pts,s.fgm,s.fga,s.fgp+'%',s.tpm,s.tpa,s.tpp+'%',s.ftm,s.fta,s.reb,s.ast,s.stl,s.blk,s.to,s.foul])});
    boxData.push(['TEAM','',team.pts,team.fgm,team.fga,team.fgp+'%',team.tpm,team.tpa,team.tpp+'%',team.ftm,team.fta,team.reb,team.ast,team.stl,team.blk,team.to,team.foul]);
    const ws1=XLSX.utils.aoa_to_sheet(boxData);ws1['!cols']=[{wch:18},{wch:4},...Array(15).fill({wch:6})];XLSX.utils.book_append_sheet(wb,ws1,'Box Score');
    const shotData=[['Player','#','X','Y','2pt/3pt','Made/Missed','Quarter']];
    objToArr(game.shots).forEach(s=>{const p=roster.find(r=>r.id===s.pid);
      shotData.push([p?.name||'?',p?.number||'',Math.round(s.x),Math.round(s.y),s.is3?'3PT':'2PT',s.made?'Made':'Missed',s.quarter<=4?`Q${s.quarter}`:'OT'])});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(shotData),'Shot Chart');
    const hustleData=[['Player','#','Type','Note','Quarter']];
    hustles.forEach(hp=>{const p=roster.find(r=>r.id===hp.pid);hustleData.push([p?.name||'?',p?.number||'',hp.tag,hp.note||'',hp.quarter<=4?`Q${hp.quarter}`:'OT'])});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(hustleData),'Hustle Plays');
    XLSX.writeFile(wb,`Shorewood_vs_${game.opponent}_${game.date}.xlsx`)};
  const leaderItems=[{label:'Points',data:leaders.pts},{label:'Rebounds',data:leaders.reb},{label:'Assists',data:leaders.ast},
    {label:'Steals',data:leaders.stl},{label:'Blocks',data:leaders.blk}].filter(l=>l.data&&l.data.value>0);

  return h('div',null,
    h('div',{style:{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}},
      h('button',{className:'btn btn-blue btn-sm',style:{fontWeight:700},onClick:()=>onSnapshot&&onSnapshot(gameId)},'📊 SNAPSHOT'),
      h('button',{className:'btn btn-dark btn-sm',onClick:exportImage},'📸 Save as Image'),
      h('button',{className:'btn btn-dark btn-sm',onClick:exportXLS},'📊 Download XLS')),
    h('div',{ref:reportRef,className:'card',style:{padding:24}},
      h('div',{style:{textAlign:'center',marginBottom:24}},
        h('div',{style:{fontFamily:'Archivo',fontSize:12,color:'var(--blue)',fontWeight:700,letterSpacing:'0.22em',textTransform:'uppercase',marginBottom:4}},'Shorewood Hoops'),
        h('div',{style:{fontSize:22,fontWeight:800,marginBottom:4}},`vs ${game.opponent}`),
        h('div',{style:{fontSize:14,color:'var(--text2)',marginBottom:8}},new Date(game.date).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})),
        h('div',{style:{fontSize:36,fontWeight:800}},
          h('span',{style:{color:team.pts>(game.oppScore||0)?'var(--green)':'var(--red)'}},team.pts),
          h('span',{style:{color:'var(--text2)',margin:'0 12px',fontSize:20}},'—'),
          h('span',null,game.oppScore||0)),
        h('div',{style:{fontSize:12,color:team.pts>(game.oppScore||0)?'var(--green)':'var(--red)',fontWeight:700,marginTop:4}},
          team.pts>(game.oppScore||0)?'WIN':team.pts<(game.oppScore||0)?'LOSS':'TIE')),
      h('div',{className:'report-section'},h('h3',null,'🏆 Stat Leaders'),
        leaderItems.map(l=>h('div',{key:l.label,className:'leader-row'},
          h('div',null,h('span',{style:{fontSize:12,color:'var(--text2)',marginRight:8}},l.label),
            h('span',{style:{fontWeight:600}},`#${l.data.number} ${l.data.name}`)),
          h('span',{className:'leader-stat'},l.data.value)))),
      hustles.length>0&&h('div',{className:'report-section'},h('h3',null,'⚡ Shorewood Hustle Plays'),

// === LEADERBOARD ===
function calcLeaderboard(roster,games){
  if(!games.length||!roster.length)return[];
  const stats={};
  roster.forEach(p=>{stats[p.id]={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,hustle:0,charges:0}});
  games.forEach(g=>{toArr(g.activePlayers).forEach(pid=>{if(!stats[pid])return;
    const s=calcPlayerStats(g,pid),ps=stats[pid];
    ps.gp++;ps.pts+=s.pts;ps.reb+=s.reb;ps.ast+=s.ast;ps.stl+=s.stl;ps.blk+=s.blk;ps.to+=s.to;
    ps.fgm+=s.fgm;ps.fga+=s.fga;ps.tpm+=s.tpm;ps.tpa+=s.tpa;ps.ftm+=s.ftm;ps.fta+=s.fta;ps.hustle+=s.hustle});
    objToArr(g.hustlePlays).forEach(hp=>{if(stats[hp.pid]&&hp.tag==='Took a charge')stats[hp.pid].charges++})});
  const find=(label,icon,fn,fmt)=>{
    const el=roster.filter(p=>stats[p.id]?.gp>0);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>fn(stats[b.id])-fn(stats[a.id]));
    const top=sorted[0];const v=fn(stats[top.id]);if(v<=0)return null;
    const runners=sorted.slice(1,3).filter(p=>fn(stats[p.id])>0);
    return{label,icon,leader:{name:top.name,number:top.number,value:fmt?fmt(stats[top.id]):v},
      runners:runners.map(p=>({name:p.name,number:p.number,value:fmt?fmt(stats[p.id]):fn(stats[p.id])}))}};
  const eff=s=>s.pts+s.reb+s.ast+s.stl+s.blk-(s.fga-s.fgm)-(s.fta-s.ftm)-s.to;
  const pctCat=(label,icon,numK,denK,minDen)=>{
    const el=roster.filter(p=>stats[p.id]?.gp>0&&stats[p.id]?.[denK]>=minDen);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>(stats[b.id][numK]/stats[b.id][denK])-(stats[a.id][numK]/stats[a.id][denK]));
    const top=sorted[0];const pct=((stats[top.id][numK]/stats[top.id][denK])*100).toFixed(1);
    const runners=sorted.slice(1,3).filter(p=>stats[p.id][numK]>0);
    return{label,icon,leader:{name:top.name,number:top.number,value:pct+'%'},
      runners:runners.map(p=>({name:p.name,number:p.number,value:((stats[p.id][numK]/stats[p.id][denK])*100).toFixed(1)+'%'}))}};
  const toCat=(()=>{const el=roster.filter(p=>stats[p.id]?.gp>=2);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>(stats[a.id].to/stats[a.id].gp)-(stats[b.id].to/stats[b.id].gp));
    const top=sorted[0];const runners=sorted.slice(1,3);
    return{label:'Fewest TO/Game',icon:'🧠',leader:{name:top.name,number:top.number,value:(stats[top.id].to/stats[top.id].gp).toFixed(1)},
      runners:runners.map(p=>({name:p.name,number:p.number,value:(stats[p.id].to/stats[p.id].gp).toFixed(1)}))}})();
  return[find('Points Leader','🏀',s=>s.pts),find('Rebound Leader','💪',s=>s.reb),
    find('Assists Leader','🎯',s=>s.ast),find('Steals Leader','🔒',s=>s.stl),
    find('Blocks Leader','🚫',s=>s.blk),find('3-Point Leader','🎯',s=>s.tpm),
    pctCat('FT% Leader','🎖','ftm','fta',5),pctCat('FG% Leader','📈','fgm','fga',10),
    find('Charge Leader','⚡',s=>s.charges),find('Hustle Play Leader','🔥',s=>s.hustle),
    toCat,find('Efficiency Leader','👑',s=>eff(s))].filter(Boolean);
}

// === MAIN APP ===
function App(){
  const [roster,setRoster]=useState([]);
  const [games,setGames]=useState({});
  const [screen,setScreen]=useState('roster');
  const [activeGameId,setActiveGameId]=useState(null);
  const [role,setRole]=useState(null);
  const [reportGameId,setReportGameId]=useState(null);
  const [connected,setConnected]=useState(false);
  const [endGameSnap,setEndGameSnap]=useState(null);
  const [historySnap,setHistorySnap]=useState(null);
  const resumedRef=useRef(false);

  useEffect(()=>{
    const rH=db.ref('roster').on('value',snap=>{const v=snap.val();setRoster(v?toArr(v):[])});
    const gH=db.ref('games').on('value',snap=>{setGames(snap.val()||{})});
    const cH=db.ref('.info/connected').on('value',snap=>{setConnected(snap.val()===true)});
    return()=>{db.ref('roster').off('value',rH);db.ref('games').off('value',gH);db.ref('.info/connected').off('value',cH)};
  },[]);

  // Auto-resume if this device has an active role
  useEffect(()=>{
    if(resumedRef.current||!Object.keys(games).length)return;
    const g=Object.values(games).find(g=>g.status==='active'&&g.roles?.[DEVICE_ID]);
    if(g){resumedRef.current=true;setActiveGameId(g.id);setRole(g.roles[DEVICE_ID]);setScreen('live')}
  },[games]);

  // If active game ends (another device ended it), show snapshot first
  useEffect(()=>{
    if(activeGameId&&games[activeGameId]?.status==='completed'&&screen==='live'){
      setEndGameSnap({gameId:activeGameId,game:games[activeGameId]})}
  },[games,activeGameId,screen]);
  const dismissEndSnap=()=>{const gid=endGameSnap?.gameId;setEndGameSnap(null);
    setReportGameId(gid);setScreen('report');setActiveGameId(null);setRole(null)};

  const activeGames=Object.values(games).filter(g=>g.status==='active');
  const startGame=id=>{setActiveGameId(id);setScreen('pickrole')};
  const pickRole=r=>{setRole(r);setScreen('live')};
  const endGame=id=>{db.ref(`games/${id}/roles/${DEVICE_ID}`).remove();
    setEndGameSnap({gameId:id,game:games[id]})};
  const viewReport=id=>{setReportGameId(id);setScreen('report')};
  const leaveGame=()=>{if(activeGameId)db.ref(`games/${activeGameId}/roles/${DEVICE_ID}`).remove();
    setActiveGameId(null);setRole(null);setScreen('roster')};

  const activeGame=activeGameId?games[activeGameId]:null;
  const isLive=screen==='live'&&activeGame;

  const screens={
    roster:()=>h(RosterScreen,{roster,setRoster}),
    newgame:()=>h(GameSetupScreen,{roster,onStart:startGame}),
    pickrole:()=>activeGame?h(RolePicker,{game:activeGame,gameId:activeGameId,onPick:pickRole}):h('div',{className:'empty'},'Game not found'),
    live:()=>{if(!activeGame)return h('div',{className:'empty'},'No active game');
      if(role==='offense')return h(OffenseView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame,games});
      if(role==='defense')return h(DefenseView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame,games});
      if(role==='coach')return h(CoachView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame,games});
      if(role==='both')return h(BothView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame,games});
      return h(RolePicker,{game:activeGame,gameId:activeGameId,onPick:pickRole})},
    report:()=>h(PostGameReport,{gameId:reportGameId,games,roster,onSnapshot:id=>setHistorySnap(id)}),
    history:()=>h(GameHistoryScreen,{roster,games,onViewReport:viewReport,onSnapshot:id=>setHistorySnap(id)}),
    season:()=>h(SeasonStatsScreen,{roster,games}),
    leaderboard:()=>h(LeaderboardScreen,{roster,games}),
  };

  return h('div',{className:'app'},

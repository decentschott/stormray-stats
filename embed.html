<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stormray Leaderboard Embed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:transparent;--card:#141414;--border:#2a2a2a;--text:#fff;--text2:#999;--blue:#4169E1}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:8px}
.brand{text-align:center;font-size:11px;color:var(--blue);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
h1{text-align:center;font-size:20px;font-weight:800;margin-bottom:4px}
.record{text-align:center;font-size:13px;color:var(--text2);margin-bottom:16px}
.record .w{color:#22c55e;font-weight:700}.record .l{color:#ef4444;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.cat-label{font-size:10px;color:var(--blue);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.leader{display:flex;align-items:center;justify-content:space-between}
.leader-left{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.leader-name{font-weight:700;font-size:14px}
.leader-rank{font-size:10px;color:var(--text2)}
.leader-value{font-size:22px;font-weight:800;color:var(--blue)}
.runners{border-top:1px solid var(--border);padding-top:4px;margin-top:6px}
.runner{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:12px;color:var(--text2)}
.runner-val{font-weight:700;color:var(--text)}
.empty{text-align:center;padding:40px 16px;color:var(--text2);font-size:14px}
.footer{text-align:center;margin-top:16px;font-size:10px;color:#444;letter-spacing:1px;text-transform:uppercase}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Same localStorage data source as main app
const DB={
  get:(k,d)=>{try{const v=localStorage.getItem('stormray_'+k);return v?JSON.parse(v):d}catch{return d}},
  getRoster:()=>DB.get('roster',[]),getGames:()=>DB.get('games',[]),
};
function calcPlayerStats(game,pid){
  const shots=(game.shots||[]).filter(s=>s.pid===pid);
  const fgm=shots.filter(s=>s.made).length,fga=shots.length;
  const tpm=shots.filter(s=>s.made&&s.is3).length,tpa=shots.filter(s=>s.is3).length;
  const ps=game.playerStats||{},p=ps[pid]||{};
  const ftm=p.ftm||0,fta=(p.ftm||0)+(p.ftx||0);
  return {fgm,fga,tpm,tpa,ftm,fta,pts:(fgm-tpm)*2+tpm*3+ftm,reb:p.reb||0,ast:p.ast||0,stl:p.stl||0,blk:p.blk||0,to:p.to||0,
    hustle:(game.hustlePlays||[]).filter(h=>h.pid===pid).length};
}
function calcTeamStats(game){const pids=game.activePlayers||[];let pts=0;pids.forEach(pid=>{pts+=calcPlayerStats(game,pid).pts});return{pts}}

function render(){
  const roster=DB.getRoster(),games=DB.getGames().filter(g=>g.status==='completed'),root=document.getElementById('root');
  if(!games.length||!roster.length){root.innerHTML='<div class="brand">\u26A1 Stormray</div><div class="empty">No games yet</div>';return}
  const stats={};
  roster.forEach(p=>{stats[p.id]={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,hustle:0,charges:0}});
  games.forEach(g=>{
    (g.activePlayers||[]).forEach(pid=>{if(!stats[pid])return;const s=calcPlayerStats(g,pid),ps=stats[pid];
      ps.gp++;ps.pts+=s.pts;ps.reb+=s.reb;ps.ast+=s.ast;ps.stl+=s.stl;ps.blk+=s.blk;ps.to+=s.to;
      ps.fgm+=s.fgm;ps.fga+=s.fga;ps.tpm+=s.tpm;ps.tpa+=s.tpa;ps.ftm+=s.ftm;ps.fta+=s.fta;ps.hustle+=s.hustle});
    (g.hustlePlays||[]).forEach(h=>{if(stats[h.pid]&&h.tag==='Took a charge')stats[h.pid].charges++})});
  const wins=games.filter(g=>calcTeamStats(g).pts>(g.oppScore||0)).length,losses=games.length-wins;
  const find=(label,icon,fn)=>{
    const el=roster.filter(p=>stats[p.id]?.gp>0),sorted=[...el].sort((a,b)=>fn(stats[b.id])-fn(stats[a.id]));
    if(!sorted.length)return null;const top=sorted[0];const v=fn(stats[top.id]);if(v<=0)return null;
    const runners=sorted.slice(1,3).filter(p=>fn(stats[p.id])>0);
    return{label,icon,leader:{name:top.name,number:top.number,value:v},runners:runners.map(p=>({name:p.name,number:p.number,value:fn(stats[p.id])}))};
  };
  const eff=s=>s.pts+s.reb+s.ast+s.stl+s.blk-(s.fga-s.fgm)-(s.fta-s.ftm)-s.to;
  const pctCat=(label,icon,numK,denK,minDen)=>{
    const el=roster.filter(p=>stats[p.id]?.gp>0&&stats[p.id][denK]>=minDen);
    if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>(stats[b.id][numK]/stats[b.id][denK])-(stats[a.id][numK]/stats[a.id][denK]));
    const top=sorted[0];const pct=((stats[top.id][numK]/stats[top.id][denK])*100).toFixed(1);
    const runners=sorted.slice(1,3).filter(p=>stats[p.id][numK]>0);
    return{label,icon,leader:{name:top.name,number:top.number,value:pct+'%'},
      runners:runners.map(p=>({name:p.name,number:p.number,value:((stats[p.id][numK]/stats[p.id][denK])*100).toFixed(1)+'%'}))};
  };
  const toCat=(()=>{
    const el=roster.filter(p=>stats[p.id]?.gp>=2);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>(stats[a.id].to/stats[a.id].gp)-(stats[b.id].to/stats[b.id].gp));
    const top=sorted[0];const runners=sorted.slice(1,3);
    return{label:'Fewest TO/Game',icon:'\u{1F9E0}',leader:{name:top.name,number:top.number,value:(stats[top.id].to/stats[top.id].gp).toFixed(1)},
      runners:runners.map(p=>({name:p.name,number:p.number,value:(stats[p.id].to/stats[p.id].gp).toFixed(1)}))};
  })();
  const cats=[find('Points','\u{1F3C0}',s=>s.pts),find('Rebounds','\u{1F4AA}',s=>s.reb),find('Assists','\u{1F3AF}',s=>s.ast),
    find('Steals','\u{1F512}',s=>s.stl),find('Blocks','\u{1F6AB}',s=>s.blk),find('3-Pointers','\u{1F3AF}',s=>s.tpm),
    pctCat('FT%','\u{1F396}','ftm','fta',5),pctCat('FG%','\u{1F4C8}','fgm','fga',10),
    find('Charges','\u26A1',s=>s.charges),find('Hustle Plays','\u{1F525}',s=>s.hustle),
    toCat,find('Efficiency','\u{1F451}',s=>eff(s))].filter(Boolean);

  let html=`<div class="brand">\u26A1 Stormray Basketball</div><h1>Season Leaders</h1>
    <div class="record">${games.length} Games \u00B7 <span class="w">${wins}</span>-<span class="l">${losses}</span></div><div class="grid">`;
  cats.forEach(c=>{
    html+=`<div class="card"><div class="cat-label"><span>${c.icon}</span>${c.label}</div>
      <div class="leader"><div class="leader-left"><div class="avatar">${c.leader.number}</div>
      <div><div class="leader-name">${c.leader.name}</div><div class="leader-rank">#1</div></div></div>
      <div class="leader-value">${c.leader.value}</div></div>`;
    if(c.runners.length){html+='<div class="runners">';c.runners.forEach((r,i)=>{
      html+=`<div class="runner"><span>#${i+2} \u00B7 #${r.number} ${r.name}</span><span class="runner-val">${r.value}</span></div>`});html+='</div>'}
    html+='</div>'});
  html+='</div><div class="footer">\u26A1 Stormray Stats</div>';
  root.innerHTML=html;
}
render();setInterval(render,30000);
</script>
</body>
</html>

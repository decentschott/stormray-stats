<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stormray Stats</title>
<meta name="apple-mobile-web-app-title" content="Stormray">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0a;--card:#141414;--card2:#1c1c1c;--border:#2a2a2a;--text:#fff;--text2:#999;--blue:#4169E1;--blue2:#5a7fe8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);--safe-left:env(safe-area-inset-left);--safe-right:env(safe-area-inset-right)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);padding-left:var(--safe-left);padding-right:var(--safe-right)}
button{font-family:inherit;cursor:pointer;border:none;outline:none;-webkit-appearance:none}
input,textarea{font-family:inherit;outline:none;border:none;background:var(--card2);color:var(--text);border-radius:8px;padding:10px 14px;font-size:15px}
input::placeholder,textarea::placeholder{color:var(--text2)}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:18px;font-weight:800;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.logo .bolt{color:var(--blue);font-size:22px}
.nav{display:flex;gap:4px;flex-shrink:0;padding:0 8px;border-bottom:1px solid var(--border);background:var(--card);overflow-x:auto}
.nav button{padding:10px 16px;background:none;color:var(--text2);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid transparent;white-space:nowrap}
.nav button.active{color:var(--blue);border-bottom-color:var(--blue)}
.screen{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;transition:all .15s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:active{background:var(--blue2)}
.btn-dark{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn-dark:active{background:#252525}
.btn-danger{background:#3a1515;color:var(--red);border:1px solid #4a2020}.btn-danger:active{background:#4a2020}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-lg{padding:16px 24px;font-size:17px;border-radius:12px;width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;margin-bottom:16px}
h2{font-size:20px;font-weight:700;margin-bottom:16px}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.player-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.player-number{width:40px;height:40px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.player-info{flex:1}.player-name{font-weight:600;font-size:15px}.player-pos{font-size:12px;color:var(--text2)}
.player-actions{display:flex;gap:6px}
.game-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.score-display{font-size:28px;font-weight:800;letter-spacing:2px}
.score-display .vs-label{font-size:12px;color:var(--text2);font-weight:400;margin:0 8px}
.quarter-pills{display:flex;gap:4px}
.quarter-pills button{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:700;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.quarter-pills button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.player-chips{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg)}
.player-chip{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--card2);color:var(--text2);border:2px solid transparent;flex-shrink:0}
.player-chip.selected{background:rgba(65,105,225,.2);color:var(--blue);border-color:var(--blue)}
.player-chip .chip-num{font-weight:800;margin-right:4px}
.live-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.court-container{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0;position:relative}
.court-container svg{width:100%;height:100%;max-height:400px}
.stat-bar{padding:8px 12px;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.stat-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;border-radius:8px;background:var(--card2);color:var(--text);font-size:11px;font-weight:700;border:1px solid var(--border);min-height:52px;position:relative}
.stat-btn .count{font-size:18px;font-weight:800;color:var(--blue);line-height:1}
.stat-btn:active{background:var(--blue);border-color:var(--blue)}
.stat-btn.hustle{background:rgba(65,105,225,.15);border-color:var(--blue);color:var(--blue);grid-column:span 2}
.stat-btn.undo{background:var(--card2);color:var(--orange);grid-column:span 2;flex-direction:row;gap:6px}
.shot-popup{position:absolute;z-index:50;display:flex;gap:8px;transform:translate(-50%,-120%)}
.shot-popup button{padding:14px 24px;border-radius:10px;font-size:15px;font-weight:700;min-width:80px}
.shot-popup .made{background:var(--green);color:#fff}
.shot-popup .missed{background:var(--red);color:#fff}
.box-table{width:100%;border-collapse:collapse;font-size:12px}
.box-table th{padding:8px 6px;text-align:center;font-weight:700;color:var(--text2);border-bottom:2px solid var(--blue);font-size:10px;text-transform:uppercase;position:sticky;top:0;background:var(--card)}
.box-table th:first-child{text-align:left}
.box-table td{padding:6px;text-align:center;border-bottom:1px solid var(--border)}
.box-table td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.box-table tr:last-child td{font-weight:700;border-top:2px solid var(--blue);border-bottom:none}
.report-section{margin-bottom:20px}
.report-section h3{font-size:14px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.leader-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px}
.leader-stat{font-weight:800;font-size:20px;color:var(--blue)}
.hustle-row{padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px}
.hustle-tag{display:inline-block;padding:2px 8px;border-radius:4px;background:rgba(65,105,225,.2);color:var(--blue);font-size:11px;font-weight:600;margin-right:6px}
.compelling-stat{text-align:center;padding:24px;background:rgba(65,105,225,.1);border:2px solid var(--blue);border-radius:12px;font-size:20px;font-weight:700}
.season-table{width:100%;border-collapse:collapse;font-size:11px;overflow-x:auto;display:block}
.season-table th{padding:8px 4px;text-align:center;font-weight:700;color:var(--text2);border-bottom:2px solid var(--blue);font-size:9px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;background:var(--card)}
.season-table th:first-child{text-align:left}
.season-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.season-table td:first-child{text-align:left;font-weight:600}
.game-list-item{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.game-list-item:active{background:var(--card2)}
.game-date{font-size:12px;color:var(--text2)}
.game-opponent{font-weight:700;font-size:15px}
.game-score{font-weight:800;font-size:18px;color:var(--blue)}
.tab-bar{display:flex;gap:4px;margin-bottom:16px}
.tab-bar button{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.tab-bar button.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* === ROLE SYSTEM === */
.role-cards{display:grid;grid-template-columns:1fr;gap:12px;max-width:420px;margin:0 auto}
.role-card{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:all .15s}
.role-card:active{border-color:var(--blue);background:rgba(65,105,225,.08)}
.role-icon{font-size:36px;margin-bottom:8px;display:block}
.role-name{font-size:18px;font-weight:800;margin-bottom:4px}
.role-desc{font-size:13px;color:var(--text2)}
.role-taken{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:rgba(245,158,11,.15);color:var(--orange)}
.conn{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.conn-on{background:var(--green)}.conn-off{background:var(--red)}
.role-tag{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-tag.offense{background:rgba(34,197,94,.15);color:var(--green)}
.role-tag.defense{background:rgba(239,68,68,.15);color:var(--red)}
.role-tag.coach{background:rgba(65,105,225,.15);color:var(--blue)}
.live-banner{padding:14px 16px;background:rgba(65,105,225,.08);border:1px solid var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;cursor:pointer}
.live-banner:active{background:rgba(65,105,225,.15)}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.coach-section{margin-bottom:20px}
.coach-section h3{font-size:14px;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* === IPHONE RESPONSIVE === */
@media(max-width:430px){
  .header{padding:8px 12px}.logo{font-size:15px;letter-spacing:1.5px}.logo .bolt{font-size:18px}
  .nav button{padding:8px 12px;font-size:11px;letter-spacing:0.5px}.screen{padding:12px}
  h2{font-size:17px;margin-bottom:12px}.btn{padding:10px 16px;font-size:14px}.btn-sm{padding:7px 11px;font-size:12px}.btn-lg{padding:14px 20px;font-size:16px}
  .game-bar{padding:8px 12px}.score-display{font-size:22px;letter-spacing:1px}.score-display .vs-label{font-size:10px;margin:0 6px}
  .quarter-pills button{padding:5px 9px;font-size:11px}
  .player-chips{gap:4px;padding:8px 10px}.player-chip{padding:6px 10px;font-size:11px;border-width:1.5px}.player-chip .chip-num{margin-right:2px}
  .court-container{padding:4px}.court-container svg{max-height:240px}
  .stat-bar{padding:6px 8px}.stat-btn{padding:6px 2px;font-size:9px;min-height:44px;border-radius:6px}.stat-btn .count{font-size:15px}.stat-btn.hustle{font-size:11px}.stat-btn.undo{font-size:11px}
  .shot-popup button{padding:16px 20px;font-size:14px;min-width:70px;border-radius:12px}.shot-popup{gap:12px}
  .player-card{padding:10px;gap:10px}.player-number{width:36px;height:36px;font-size:14px}.player-name{font-size:14px}.player-actions .btn{padding:6px 10px;font-size:11px}
  .modal-overlay{padding:8px;align-items:flex-end}.modal{max-width:100%;border-radius:16px 16px 8px 8px;padding:20px 16px;max-height:85vh}
  .leader-row{padding:8px 10px}.leader-stat{font-size:17px}.compelling-stat{font-size:16px;padding:16px}.report-section h3{font-size:12px}
  .game-list-item{padding:12px}.game-opponent{font-size:14px}.game-score{font-size:16px}
  .box-table{font-size:10px}.box-table th{padding:6px 3px;font-size:8px}.box-table td{padding:4px 3px}
  .season-table{font-size:10px}.season-table th{font-size:8px;padding:6px 3px}.season-table td{padding:4px 3px}
  .tab-bar button{padding:8px;font-size:12px}
  .role-card{padding:16px}.role-icon{font-size:28px}.role-name{font-size:16px}
}
@media(max-width:375px){
  .logo{font-size:13px}.nav button{padding:7px 8px;font-size:10px}.score-display{font-size:20px}
  .quarter-pills button{padding:4px 7px;font-size:10px}.player-chip{padding:5px 8px;font-size:10px}
  .court-container svg{max-height:200px}.stat-btn{min-height:40px;font-size:8px}.stat-btn .count{font-size:13px}.grid4{gap:4px}
}
@media(min-width:1024px){
  .court-container svg{max-height:500px}.stat-bar{max-width:600px;margin:0 auto}.screen{max-width:800px;margin:0 auto;padding:24px}.modal{max-width:500px}
}
@media(min-width:700px) and (max-width:1023px){
  .court-container svg{max-height:440px}.stat-btn{min-height:56px;font-size:12px}.stat-btn .count{font-size:20px}.player-chip{padding:10px 16px;font-size:14px}
}
</style>

<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo} = React;
const h = React.createElement;

// === FIREBASE ===
firebase.initializeApp({
  apiKey:"AIzaSyB0a3hS3Fe-X1UpojdfaOdvt2yuTsL81ag",
  authDomain:"shorewoodhoops-19d1d.firebaseapp.com",
  databaseURL:"https://shorewoodhoops-19d1d-default-rtdb.firebaseio.com",
  projectId:"shorewoodhoops-19d1d",
  storageBucket:"shorewoodhoops-19d1d.firebasestorage.app",
  messagingSenderId:"977266607962",
  appId:"1:977266607962:web:73567ce96d582ff342d563"
});
const db = firebase.database();

// Device ID — persists per browser/device
const DEVICE_ID = localStorage.getItem('stormray_did') || (()=>{
  const id='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  localStorage.setItem('stormray_did',id);return id;
})();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const toArr=v=>Array.isArray(v)?v:(v?Object.values(v):[]);
const objToArr=o=>o?Object.values(o):[];
const HUSTLE_TAGS=['Dove for loose ball','Took a charge','Deflection','Box out','Hustle back on D','Saved possession','50/50 ball','Screen & recover'];

// Opponent score helper — supports both legacy oppScore and per-quarter oppScoreByQ
function getOppScore(game){
  if(game.oppScoreByQ){const q=game.oppScoreByQ;return(q[1]||0)+(q[2]||0)+(q[3]||0)+(q[4]||0)+(q[5]||0)}
  return getOppScore(game);
}

// === STAT CALCULATIONS ===
function calcPlayerStats(game,pid){
  const shots=objToArr(game.shots).filter(s=>s.pid===pid);
  const fgm=shots.filter(s=>s.made).length,fga=shots.length;
  const tpm=shots.filter(s=>s.made&&s.is3).length,tpa=shots.filter(s=>s.is3).length;
  const ps=game.playerStats||{},p=ps[pid]||{};
  const ftm=p.ftm||0,fta=(p.ftm||0)+(p.ftx||0);
  const pts=(fgm-tpm)*2+tpm*3+ftm;
  return {fgm,fga,fgp:fga?((fgm/fga)*100).toFixed(0):'-',tpm,tpa,tpp:tpa?((tpm/tpa)*100).toFixed(0):'-',
    ftm,fta,ftp:fta?((ftm/fta)*100).toFixed(0):'-',pts,reb:p.reb||0,ast:p.ast||0,stl:p.stl||0,blk:p.blk||0,
    to:p.to||0,foul:p.foul||0,hustle:objToArr(game.hustlePlays).filter(hp=>hp.pid===pid).length};
}

function calcTeamStats(game){
  const pids=toArr(game.activePlayers);
  const team={fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,foul:0,hustle:0};
  pids.forEach(pid=>{const s=calcPlayerStats(game,pid);Object.keys(team).forEach(k=>{if(typeof s[k]==='number')team[k]+=s[k]})});
  team.fgp=team.fga?((team.fgm/team.fga)*100).toFixed(1):'-';
  team.tpp=team.tpa?((team.tpm/team.tpa)*100).toFixed(1):'-';
  team.ftp=team.fta?((team.ftm/team.fta)*100).toFixed(1):'-';
  return team;
}

function getStatLeaders(game,roster){
  const pids=toArr(game.activePlayers),stats={};
  pids.forEach(pid=>{stats[pid]=calcPlayerStats(game,pid)});
  const find=key=>{let best=null,bv=-1;pids.forEach(pid=>{if(stats[pid][key]>bv){bv=stats[pid][key];best=pid}});
    const p=roster.find(r=>r.id===best);return p?{name:p.name,number:p.number,value:bv}:null};
  return {pts:find('pts'),reb:find('reb'),ast:find('ast'),stl:find('stl'),blk:find('blk')};
}

function getMostCompelling(game){
  const t=calcTeamStats(game),c=[];
  if(t.fga>=15){const p=parseFloat(t.fgp);if(p>=50)c.push({text:`Shot ${t.fgp}% from the field (${t.fgm}/${t.fga})`,score:p-45})}
  if(t.tpa>=8){const p=parseFloat(t.tpp);if(p>=35)c.push({text:`Hit ${t.tpm} threes at ${t.tpp}% (${t.tpm}/${t.tpa})`,score:p-30})}
  if(t.ast>=10)c.push({text:`Dished out ${t.ast} assists as a team`,score:t.ast-8});
  if(t.stl>=8)c.push({text:`Forced ${t.stl} steals on defense`,score:t.stl-6});
  if(t.to<=8&&t.fga>=20)c.push({text:`Only ${t.to} turnovers`,score:12-t.to});
  if(t.reb>=30)c.push({text:`Controlled the boards with ${t.reb} rebounds`,score:t.reb-25});
  if(t.ast&&t.to)c.push({text:`${(t.ast/t.to).toFixed(1)}:1 assist-to-turnover ratio`,score:(t.ast/t.to)-1});
  if(t.hustle>=5)c.push({text:`${t.hustle} Stormray Hustle Plays`,score:t.hustle-3});
  c.sort((a,b)=>b.score-a.score);return c[0]?.text||`Scored ${t.pts} points as a team`;
}

// === 3PT DETECTION ===
const BASKET_X=250,BASKET_Y=52.5,THREE_R=221.5,CORNER_X=33;
function is3pt(x,y){if(x<CORNER_X||x>500-CORNER_X)return true;const dx=x-BASKET_X,dy=y-BASKET_Y;return Math.sqrt(dx*dx+dy*dy)>THREE_R}

// === HALF COURT SVG ===
function HalfCourt({shots=[],onTap,selectedPid,readOnly}){
  const svgRef=useRef(null);
  const [popup,setPopup]=useState(null);
  const handlePointerDown=useCallback(e=>{
    if(readOnly)return;
    if(!selectedPid){alert('Select a player first');return}
    const svg=svgRef.current,pt=svg.createSVGPoint();
    pt.x=e.clientX;pt.y=e.clientY;
    const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
    if(sp.x<5||sp.x>495||sp.y<5||sp.y>415)return;
    setPopup({x:sp.x,y:sp.y});
  },[selectedPid,readOnly]);
  const handleResult=made=>{if(!popup)return;
    onTap({x:popup.x,y:popup.y,made,is3:is3pt(popup.x,popup.y),pid:selectedPid,id:uid(),ts:Date.now()});
    setPopup(null)};
  const arcStartY=Math.sqrt(THREE_R*THREE_R-(BASKET_X-CORNER_X)*(BASKET_X-CORNER_X));
  const arcY=BASKET_Y+arcStartY;

  return h('div',{style:{position:'relative',width:'100%',height:'100%'}},

      h('path',{d:'M 210 0 A 40 40 0 0 0 290 0',fill:'none',stroke:'#333',strokeWidth:1}),
      h('path',{d:arcPath,fill:'none',stroke:'#4169E1',strokeWidth:2,strokeOpacity:0.6}),

  const [undoStack,setUndoStack]=useState([]);
  const teamStats=calcTeamStats(game);
  const pStats=selPid?calcPlayerStats(game,selPid):{};
  const selPlayer=roster.find(p=>p.id===selPid);
  const playerShots=objToArr(game.shots).filter(s=>s.pid===selPid);

  const addShot=shot=>{shot.quarter=game.quarter;
    db.ref(`games/${gameId}/shots/${shot.id}`).set(shot);
    setUndoStack(s=>[...s,{type:'shot',id:shot.id}])};
  const addStat=key=>{if(!selPid)return;
    const prev=game.playerStats?.[selPid]?.[key]||0;
    db.ref(`games/${gameId}/playerStats/${selPid}/${key}`).set(prev+1);
    setUndoStack(s=>[...s,{type:'stat',pid:selPid,key,prev}])};
  const undo=()=>{if(!undoStack.length)return;const last=undoStack[undoStack.length-1];
    if(last.type==='shot')db.ref(`games/${gameId}/shots/${last.id}`).remove();
    else if(last.type==='stat')db.ref(`games/${gameId}/playerStats/${last.pid}/${last.key}`).set(last.prev);

  const endGame=()=>{if(confirm('End this game?')){db.ref(`games/${gameId}/status`).set('completed');onEnd(gameId)}};

          const count=selPid&&game.playerStats?.[selPid]?game.playerStats[selPid][key]||0:0;
          return h('button',{key,className:'stat-btn',onClick:()=>addStat(key)},
            h('span',{className:'count'},count),h('span',null,labels[key]))})),

// === POST-GAME REPORT ===
function PostGameReport({gameId,games,roster}){
  const game=games[gameId];
  const reportRef=useRef(null);
  if(!game)return h('div',{className:'empty'},'Game not found');
  const team=calcTeamStats(game);
  const leaders=getStatLeaders(game,roster);
  const compelling=getMostCompelling(game);
  const hustles=objToArr(game.hustlePlays);
  const exportImage=async()=>{const el=reportRef.current;if(!el)return;
    try{const canvas=await html2canvas(el,{backgroundColor:'#0a0a0a',scale:2});
      const link=document.createElement('a');link.download=`stormray_vs_${game.opponent}_${game.date}.png`;link.href=canvas.toDataURL();link.click()}catch(e){alert('Export failed: '+e.message)}};
  const exportXLS=()=>{const wb=XLSX.utils.book_new();const pids=toArr(game.activePlayers);
    const boxData=[['Player','#','PTS','FGM','FGA','FG%','3PM','3PA','3P%','FTM','FTA','REB','AST','STL','BLK','TO','PF']];
    pids.forEach(pid=>{const p=roster.find(r=>r.id===pid);const s=calcPlayerStats(game,pid);
      boxData.push([p?.name||'?',p?.number||'',s.pts,s.fgm,s.fga,s.fgp+'%',s.tpm,s.tpa,s.tpp+'%',s.ftm,s.fta,s.reb,s.ast,s.stl,s.blk,s.to,s.foul])});
    boxData.push(['TEAM','',team.pts,team.fgm,team.fga,team.fgp+'%',team.tpm,team.tpa,team.tpp+'%',team.ftm,team.fta,team.reb,team.ast,team.stl,team.blk,team.to,team.foul]);
    const ws1=XLSX.utils.aoa_to_sheet(boxData);ws1['!cols']=[{wch:18},{wch:4},...Array(15).fill({wch:6})];XLSX.utils.book_append_sheet(wb,ws1,'Box Score');
    const shotData=[['Player','#','X','Y','2pt/3pt','Made/Missed','Quarter']];
    objToArr(game.shots).forEach(s=>{const p=roster.find(r=>r.id===s.pid);
      shotData.push([p?.name||'?',p?.number||'',Math.round(s.x),Math.round(s.y),s.is3?'3PT':'2PT',s.made?'Made':'Missed',s.quarter<=4?`Q${s.quarter}`:'OT'])});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(shotData),'Shot Chart');
    const hustleData=[['Player','#','Type','Note','Quarter']];

// === LEADERBOARD ===
function calcLeaderboard(roster,games){
  if(!games.length||!roster.length)return[];
  const stats={};
  roster.forEach(p=>{stats[p.id]={gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,hustle:0,charges:0}});
  games.forEach(g=>{toArr(g.activePlayers).forEach(pid=>{if(!stats[pid])return;
    const s=calcPlayerStats(g,pid),ps=stats[pid];
    ps.gp++;ps.pts+=s.pts;ps.reb+=s.reb;ps.ast+=s.ast;ps.stl+=s.stl;ps.blk+=s.blk;ps.to+=s.to;
    ps.fgm+=s.fgm;ps.fga+=s.fga;ps.tpm+=s.tpm;ps.tpa+=s.tpa;ps.ftm+=s.ftm;ps.fta+=s.fta;ps.hustle+=s.hustle});
    objToArr(g.hustlePlays).forEach(hp=>{if(stats[hp.pid]&&hp.tag==='Took a charge')stats[hp.pid].charges++})});
  const find=(label,icon,fn,fmt)=>{
    const el=roster.filter(p=>stats[p.id]?.gp>0);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>fn(stats[b.id])-fn(stats[a.id]));
    const top=sorted[0];const v=fn(stats[top.id]);if(v<=0)return null;
    const runners=sorted.slice(1,3).filter(p=>fn(stats[p.id])>0);
    return{label,icon,leader:{name:top.name,number:top.number,value:fmt?fmt(stats[top.id]):v},
      runners:runners.map(p=>({name:p.name,number:p.number,value:fmt?fmt(stats[p.id]):fn(stats[p.id])}))}};
  const eff=s=>s.pts+s.reb+s.ast+s.stl+s.blk-(s.fga-s.fgm)-(s.fta-s.ftm)-s.to;
  const pctCat=(label,icon,numK,denK,minDen)=>{
    const el=roster.filter(p=>stats[p.id]?.gp>0&&stats[p.id]?.[denK]>=minDen);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>(stats[b.id][numK]/stats[b.id][denK])-(stats[a.id][numK]/stats[a.id][denK]));
    const top=sorted[0];const pct=((stats[top.id][numK]/stats[top.id][denK])*100).toFixed(1);
    const runners=sorted.slice(1,3).filter(p=>stats[p.id][numK]>0);
    return{label,icon,leader:{name:top.name,number:top.number,value:pct+'%'},
      runners:runners.map(p=>({name:p.name,number:p.number,value:((stats[p.id][numK]/stats[p.id][denK])*100).toFixed(1)+'%'}))}};
  const toCat=(()=>{const el=roster.filter(p=>stats[p.id]?.gp>=2);if(!el.length)return null;
    const sorted=[...el].sort((a,b)=>(stats[a.id].to/stats[a.id].gp)-(stats[b.id].to/stats[b.id].gp));
    const top=sorted[0];const runners=sorted.slice(1,3);
    return{label:'Fewest TO/Game',icon:'🧠',leader:{name:top.name,number:top.number,value:(stats[top.id].to/stats[top.id].gp).toFixed(1)},
      runners:runners.map(p=>({name:p.name,number:p.number,value:(stats[p.id].to/stats[p.id].gp).toFixed(1)}))}})();
  return[find('Points Leader','🏀',s=>s.pts),find('Rebound Leader','💪',s=>s.reb),
    find('Assists Leader','🎯',s=>s.ast),find('Steals Leader','🔒',s=>s.stl),
    find('Blocks Leader','🚫',s=>s.blk),find('3-Point Leader','🎯',s=>s.tpm),
    pctCat('FT% Leader','🎖','ftm','fta',5),pctCat('FG% Leader','📈','fgm','fga',10),
    find('Charge Leader','⚡',s=>s.charges),find('Hustle Play Leader','🔥',s=>s.hustle),
    toCat,find('Efficiency Leader','👑',s=>eff(s))].filter(Boolean);
}

// === MAIN APP ===
function App(){
  const [roster,setRoster]=useState([]);
  const [games,setGames]=useState({});
  const [screen,setScreen]=useState('roster');
  const [activeGameId,setActiveGameId]=useState(null);
  const [role,setRole]=useState(null);
  const [reportGameId,setReportGameId]=useState(null);
  const [connected,setConnected]=useState(false);
  const resumedRef=useRef(false);

  useEffect(()=>{
    const rH=db.ref('roster').on('value',snap=>{const v=snap.val();setRoster(v?toArr(v):[])});
    const gH=db.ref('games').on('value',snap=>{setGames(snap.val()||{})});
    const cH=db.ref('.info/connected').on('value',snap=>{setConnected(snap.val()===true)});
    return()=>{db.ref('roster').off('value',rH);db.ref('games').off('value',gH);db.ref('.info/connected').off('value',cH)};
  },[]);

  // Auto-resume if this device has an active role
  useEffect(()=>{
    if(resumedRef.current||!Object.keys(games).length)return;
    const g=Object.values(games).find(g=>g.status==='active'&&g.roles?.[DEVICE_ID]);
    if(g){resumedRef.current=true;setActiveGameId(g.id);setRole(g.roles[DEVICE_ID]);setScreen('live')}
  },[games]);

  // If active game ends (another device ended it), go to report
  useEffect(()=>{
    if(activeGameId&&games[activeGameId]?.status==='completed'&&screen==='live'){
      setReportGameId(activeGameId);setScreen('report');setActiveGameId(null);setRole(null)}
  },[games,activeGameId,screen]);

  const activeGames=Object.values(games).filter(g=>g.status==='active');
  const startGame=id=>{setActiveGameId(id);setScreen('pickrole')};
  const pickRole=r=>{setRole(r);setScreen('live')};
  const endGame=id=>{db.ref(`games/${id}/roles/${DEVICE_ID}`).remove();
    setActiveGameId(null);setRole(null);setReportGameId(id);setScreen('report')};
  const viewReport=id=>{setReportGameId(id);setScreen('report')};
  const leaveGame=()=>{if(activeGameId)db.ref(`games/${activeGameId}/roles/${DEVICE_ID}`).remove();
    setActiveGameId(null);setRole(null);setScreen('roster')};

  const activeGame=activeGameId?games[activeGameId]:null;
  const isLive=screen==='live'&&activeGame;

  const screens={
    roster:()=>h(RosterScreen,{roster,setRoster}),
    newgame:()=>h(GameSetupScreen,{roster,onStart:startGame}),
    pickrole:()=>activeGame?h(RolePicker,{game:activeGame,gameId:activeGameId,onPick:pickRole}):h('div',{className:'empty'},'Game not found'),
    live:()=>{if(!activeGame)return h('div',{className:'empty'},'No active game');
      if(role==='offense')return h(OffenseView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame});
      if(role==='defense')return h(DefenseView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame});
      if(role==='coach')return h(CoachView,{game:activeGame,gameId:activeGameId,roster,onEnd:endGame});
      return h(RolePicker,{game:activeGame,gameId:activeGameId,onPick:pickRole})},
    report:()=>h(PostGameReport,{gameId:reportGameId,games,roster}),
    history:()=>h(GameHistoryScreen,{roster,games,onViewReport:viewReport}),
    season:()=>h(SeasonStatsScreen,{roster,games}),
    leaderboard:()=>h(LeaderboardScreen,{roster,games}),
  };

  return h('div',{className:'app'},
    h('div',{className:'header'},
      h('div',{className:'logo'},
        h('img',{src:'logo.png',alt:'Shorewood',style:{height:32,width:'auto',objectFit:'contain'}}),h('span',null,'Stormray Stats')),
      h('div',{style:{display:'flex',alignItems:'center',gap:8}},
        h('a',{href:'howto.html',target:'_blank',style:{width:28,height:28,borderRadius:'50%',background:'var(--card2)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)',fontSize:14,fontWeight:700,textDecoration:'none'}},'?'),
        h('div',{className:'conn'},h('span',{className:`conn-dot ${connected?'conn-on':'conn-off'}`}),connected?'Live':'Offline'),
        isLive&&h('button',{className:'btn btn-dark btn-sm',onClick:leaveGame},'Leave'),
        activeGameId&&!isLive&&h('button',{className:'btn btn-blue btn-sm',onClick:()=>setScreen('live')},'◉ Live'))),
    !isLive&&h('div',{className:'nav'},
      [{k:'roster',l:'Roster'},{k:'newgame',l:'New Game'},{k:'history',l:'Games'},{k:'season',l:'Season'},{k:'leaderboard',l:'Leaders'},{k:'report',l:'Report'}]
        .map(n=>h('button',{key:n.k,className:screen===n.k?'active':'',onClick:()=>setScreen(n.k)},n.l))),
    // Live game banner on non-live screens
    !isLive&&screen!=='pickrole'&&activeGames.length>0&&!activeGameId&&h('div',{style:{padding:'8px 16px'}},
      activeGames.map(g=>h('div',{key:g.id,className:'live-banner',onClick:()=>{setActiveGameId(g.id);setScreen('pickrole')}},
        h('div',{style:{display:'flex',alignItems:'center',gap:10}},
          h('div',{className:'pulse-dot'}),
          h('div',null,h('div',{style:{fontWeight:700}},`vs ${g.opponent}`),h('div',{style:{fontSize:12,color:'var(--text2)'}},'Game in progress'))),
        h('span',{className:'btn btn-blue btn-sm'},'Join')))),
    isLive?screens.live():h('div',{className:'screen'},screens[screen]?.()));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
